name: u
description: The only package you need, a complete set of packages and utilities you need in every single project.
version: 3.2.0
homepage: https://sinamn75.com
repository: https://github.com/SinaMN75/U_flutter
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  webview_all: ^1.4.5
  flutter_svg: ^2.3.0
  flutter_map: ^8.3.2
  lottie: ^3.6.1

  intl: ^0.20.3
  web: ^1.1.2
  path: ^1.9.1
  async: ^2.13.1
  http: ^1.6.0
  latlong2: ^0.10.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - lib/assets/fonts/
    - lib/assets/flags/
    - lib/assets/icons/
  fonts:
    - family: Vazir
      fonts:
        - asset: lib/assets/fonts/Vazir.ttf

  plugin:
    platforms:
      android:
        package: com.sinamn75.u
        pluginClass: UPlugin
      ios:
        pluginClass: UPlugin
      linux:
        pluginClass: UPlugin
      macos:
        pluginClass: UPlugin
      windows:
        pluginClass: UPluginCApi
      web:
        pluginClass: UWeb
        fileName: src/web/u_web_browser.dart

#  flutter pub upgrade --major-versions --tighten

# ───────────────────────── u:app: native app settings for all 6 platforms ─────────────────────────
# Full documentation of every command and combination: COMMANDS.md
# Run these inside the app that depends on u (not in this plugin). They work on Windows, macOS and Linux.
# Every command accepts:
#   --platforms android,ios,macos,linux,windows,web   only touch these platforms
#   --dry-run                                         show what would change, write nothing
#   --help                                            usage + examples for that command
#
# dart run u:app help
# dart run u:app info
# dart run u:app doctor
#
# Name & id:
# dart run u:app name ""
# dart run u:app name "" --short ""
# dart run u:app id com.company.app
# dart run u:app id com.company.app --ios com.company.appIos --macos com.company.appMac
#
# Minimum OS / SDK levels:
# dart run u:app min-sdk android 24
# dart run u:app min-sdk ios 18
# dart run u:app min-sdk macos 15
# dart run u:app min-sdk android 24 ios 18 macos 14
# dart run u:app min-sdk android default
# dart run u:app target-sdk 36
# dart run u:app compile-sdk 36
# dart run u:app ndk 27.0.12077973
# dart run u:app java 17
#
# Version & description:
# dart run u:app version 1.0.0+1
# dart run u:app bump
# dart run u:app bump patch
# dart run u:app bump minor
# dart run u:app bump major
# dart run u:app description "What the app does"
#
# Permissions (friendly names → AndroidManifest, iOS/macOS Info.plist, macOS entitlements):
# dart run u:app permission list
# dart run u:app permission add internet
# dart run u:app permission add camera microphone
# dart run u:app permission add location
# dart run u:app permission add location-always
# dart run u:app permission add photos save-photos
# dart run u:app permission add notifications alarm vibrate
# dart run u:app permission add camera --message "We need the camera to scan QR codes"
# dart run u:app permission remove contacts
#   names: internet, network-state, camera, microphone, speech, location, location-always, photos,
#          save-photos, music, storage, contacts, calendar, reminders, bluetooth, notifications, alarm,
#          vibrate, biometric, motion, nfc, phone, sms, wake-lock, foreground-service, background-audio,
#          background-fetch, remote-notifications, local-network, tracking, install-apk, overlay
#
# Orientation & deep links:
# dart run u:app orientation portrait
# dart run u:app orientation landscape
# dart run u:app orientation all
# dart run u:app deep-link myapp
# dart run u:app deep-link myapp --host open
# dart run u:app deep-link remove myapp
#
# iOS + macOS on Swift Package Manager instead of CocoaPods (no `pod` needed):
# dart run u:app spm
# dart run u:app spm --force                 (also when a plugin still has no Package.swift)
#
# Apple signing / desktop identity / web:
# dart run u:app team ABCDE12345
# dart run u:app binary my_app
# dart run u:app company "My Company"
# dart run u:app copyright "© 2026 My Company"
# dart run u:app web-color "#0175C2"
# dart run u:app web-color "#0175C2" --background "#FFFFFF"
#
# Android release signing: asks every question Android Studio asks (store password, key alias, key password,
# validity, name, organization, city, country…), creates upload-keystore.jks in the project root, writes
# android/key.properties and the Gradle signingConfig. After that every release build is signed.
# dart run u:app signing --create
# dart run u:app signing                     (use a .jks you already have)
#
# App icon for all 6 platforms from one PNG (replaces flutter_launcher_icons):
# dart run u:app icon assets/icon.png
# dart run u:app icon assets/icon.png --background "#FFFFFF"
# dart run u:app icon assets/icon.png --background "#0175C2" --foreground assets/icon_foreground.png --monochrome
# dart run u:app icon assets/icon.png --background assets/icon_background.png --inset 20
# dart run u:app icon assets/icon.png --ios-background "#000000"
#
# Native splash screen on Android (incl. 12+), iOS and web (replaces flutter_native_splash):
# dart run u:app splash --color "#FFFFFF"
# dart run u:app splash --color "#FFFFFF" --image assets/logo.png
# dart run u:app splash --color "#FFFFFF" --image assets/logo.png --size 160
# dart run u:app splash --color "#FFFFFF" --image assets/logo.png --dark-color "#121212" --dark-image assets/logo_dark.png
# dart run u:app splash --color "#FFFFFF" --image assets/logo.png --branding assets/brand.png --fullscreen
# dart run u:app splash --background-image assets/splash_bg.png --image assets/logo.png
# dart run u:app splash --image assets/logo.png --android12-image assets/logo_a12.png --icon-background "#0175C2"
# dart run u:app splash remove
#
# Release builds: flutter clean + pub get, build, copy <name>-<version> files to the Desktop (any OS;
# ios/ipa/macos need a Mac, windows needs Windows, linux needs Linux):
# dart run u:app build apk
# dart run u:app build aab
# dart run u:app build ios                   (archive → Xcode Organizer)
# dart run u:app build ipa
# dart run u:app build web                   (4 zips: JS and WebAssembly, each with and without the CDN; U_BUILD_ID set)
# dart run u:app build web --web js          (JS only, with and without the CDN)
# dart run u:app build web --web wasm-all    (WebAssembly only, with and without the CDN)
# dart run u:app build web --web cdn,wasm    (any mix of cdn, no-cdn, wasm, wasm-no-cdn)
# dart run u:app build macos
# dart run u:app build windows
# dart run u:app build linux
# dart run u:app build apk ios
# dart run u:app build apk web
# dart run u:app build apk macos
# dart run u:app build apk macos web
# dart run u:app build apk ios macos web
# dart run u:app build all                   (everything this computer can build; a failed target doesn't stop the rest)
# dart run u:app build all --fail-fast       (stop at the first failed target)
# dart run u:app build apk --no-clean --out build/release
# dart run u:app build apk --args="--obfuscate --split-debug-info=build/symbols"
# ─────────────────────────────────────────────────────────────────────────────────────────────────────
