name: u
description: The only package you need, a complete set of packages and utilities you need in every single project.
version: 3.0.0
homepage: https://sinamn75.com
repository: https://github.com/SinaMN75/U_flutter
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  webview_all: ^1.4.1
  flutter_svg: ^2.3.0
  share_plus: ^13.3.0
  connectivity_plus: ^7.3.1
  device_info_plus: ^13.2.0
  flutter_map: ^8.3.2
  geolocator: ^14.0.3
  lottie: ^3.6.1
  file_picker: ^13.1.0
  flutter_local_notifications: ^22.3.1

  intl: ^0.20.3
  web: ^1.1.1
  uuid: ^4.6.0
  path: ^1.9.1
  async: ^2.13.1
  http: ^1.6.0
  latlong2: ^0.10.1
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - lib/assets/fonts/
    - lib/assets/flags/
    - lib/assets/icons/
  fonts:
    - family: Vazir
      fonts:
        - asset: lib/assets/fonts/Vazir.ttf

  plugin:
    platforms:
      android:
        package: com.sinamn75.u
        pluginClass: UPlugin
      ios:
        pluginClass: UPlugin
      linux:
        pluginClass: UPlugin
      macos:
        pluginClass: UPlugin
      windows:
        pluginClass: UPluginCApi
      web:
        pluginClass: UWeb
        fileName: utils/web/u_web_browser.dart

#  flutter pub upgrade --major-versions --tighten

#  flutter pub run flutter_launcher_icons:main

# ───────────────────────── u:app: native app settings for all 6 platforms ─────────────────────────
# Run these inside the app that depends on u (not in this plugin). Every command accepts:
#   --platforms android,ios,macos,linux,windows,web   only touch these platforms
#   --dry-run                                         show what would change, write nothing
#   --help                                            usage + examples for that command
#
# dart run u:app help
# dart run u:app info
# dart run u:app doctor
#
# Name & id:
# dart run u:app name ""
# dart run u:app name "" --short ""
# dart run u:app id com.company.app
# dart run u:app id com.company.app --ios com.company.appIos --macos com.company.appMac
#
# Minimum OS / SDK levels:
# dart run u:app min-sdk android 24
# dart run u:app min-sdk ios 18
# dart run u:app min-sdk macos 15
# dart run u:app min-sdk android 24 ios 18 macos 14
# dart run u:app min-sdk android default
# dart run u:app target-sdk 36
# dart run u:app compile-sdk 36
# dart run u:app ndk 27.0.12077973
# dart run u:app java 17
#
# Version & description:
# dart run u:app version 1.0.0+1
# dart run u:app bump
# dart run u:app bump patch
# dart run u:app bump minor
# dart run u:app bump major
# dart run u:app description "What the app does"
#
# Permissions (friendly names → AndroidManifest, iOS/macOS Info.plist, macOS entitlements):
# dart run u:app permission list
# dart run u:app permission add internet
# dart run u:app permission add camera microphone
# dart run u:app permission add location
# dart run u:app permission add location-always
# dart run u:app permission add photos save-photos
# dart run u:app permission add notifications alarm vibrate
# dart run u:app permission add camera --message "We need the camera to scan QR codes"
# dart run u:app permission remove contacts
#   names: internet, network-state, camera, microphone, speech, location, location-always, photos,
#          save-photos, music, storage, contacts, calendar, reminders, bluetooth, notifications, alarm,
#          vibrate, biometric, motion, nfc, phone, sms, wake-lock, foreground-service, background-audio,
#          background-fetch, remote-notifications, local-network, tracking, install-apk, overlay
#
# Orientation & deep links:
# dart run u:app orientation portrait
# dart run u:app orientation landscape
# dart run u:app orientation all
# dart run u:app deep-link myapp
# dart run u:app deep-link myapp --host open
# dart run u:app deep-link remove myapp
#
# Apple signing / desktop identity / web:
# dart run u:app team ABCDE12345
# dart run u:app binary my_app
# dart run u:app company "My Company"
# dart run u:app copyright "© 2026 My Company"
# dart run u:app web-color "#0175C2"
# dart run u:app web-color "#0175C2" --background "#FFFFFF"
#
# Android release signing: creates the .jks in one line (no keytool questions), writes android/key.properties
# (git-ignored) and the Gradle signingConfig, so every `flutter build apk/appbundle --release` is signed after that:
# dart run u:app signing --keystore ~/keys/upload.jks --create --random-password
# dart run u:app signing --keystore ~/keys/upload.jks --create --name "Sina" --org "Sina Co." --city "Tehran" --country IR
# dart run u:app signing --keystore ~/keys/upload.jks --create --password "myStrongPass" --years 50
# dart run u:app signing --keystore ~/keys/upload.jks --create                   (asks for the password once, hidden)
# dart run u:app signing --keystore ~/keys/existing.jks --alias upload           (use a keystore you already have)
# ─────────────────────────────────────────────────────────────────────────────────────────────────────

# Android:
# N=$(sed -n 's/^name: *//p' pubspec.yaml) V=$(sed -n 's/^version: *//p' pubspec.yaml | cut -d+ -f1 | tr -d .) && flutter clean && flutter pub get && flutter build apk --target-platform android-arm64,android-arm --release && cp build/app/outputs/flutter-apk/app-release.apk ~/Desktop/$N-$V.apk

# iOS → Xcode Organizer:
# N=$(sed -n 's/^name: *//p' pubspec.yaml) V=$(sed -n 's/^version: *//p' pubspec.yaml | cut -d+ -f1 | tr -d .) && flutter clean && flutter pub get && flutter build ios --release --no-codesign && xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -archivePath ~/Library/Developer/Xcode/Archives/$(date '+%Y-%m-%d')/$N-$V.xcarchive archive && open -a Xcode

# Web:
# N=$(sed -n 's/^name: *//p' pubspec.yaml) V=$(sed -n 's/^version: *//p' pubspec.yaml | cut -d+ -f1 | tr -d .) B=$(sed -n 's/^version: *//p' pubspec.yaml) && flutter clean && flutter pub get && flutter build web --release --dart-define=U_BUILD_ID="$B" && (cd build/web && zip -r ~/Desktop/$N-$V-web.zip .)

# macOS:
# N=$(sed -n 's/^name: *//p' pubspec.yaml) V=$(sed -n 's/^version: *//p' pubspec.yaml | cut -d+ -f1 | tr -d .) && flutter clean && flutter pub get && flutter build macos --release && (cd build/macos/Build/Products/Release && zip -r ~/Desktop/$N-$V-macos.zip *.app)

