name: u
description: The only package you need, a complete set of packages and utilities you need in every single project.
version: 1.9.0
homepage: https://sinamn75.com
repository: https://github.com/SinaMN75/Utilities-flutter

environment:
  sdk: ^3.12.2
  flutter: '>=3.44.8'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.0.0
  plugin_platform_interface: ^2.0.2

  camera: ^0.12.0+2
  video_player: ^2.13.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  webview_all: ^1.3.0
  mobile_scanner: ^7.4.0
  flutter_svg: ^2.3.0
  image_picker: ^1.2.3
  share_plus: ^13.3.0
  connectivity_plus: ^7.3.1
  device_info_plus: ^13.2.0
  encrypt: ^5.0.3
  get: ^4.7.3
  flutter_map: ^8.3.1
  geolocator: ^14.0.3
  lottie: ^3.5.1
  image_cropper: ^12.2.1
  file_picker: ^12.0.0-beta.7
  flutter_local_notifications: ^22.2.0
  syncfusion_flutter_charts: ^34.1.33
  syncfusion_flutter_barcodes: ^34.1.33
  syncfusion_flutter_gauges: ^34.1.33
  syncfusion_flutter_chat: ^34.1.33
  syncfusion_flutter_signaturepad: ^34.1.33
  syncfusion_flutter_pdfviewer: ^34.1.33

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/assets/fonts/
    - lib/assets/flags/
  fonts:
    - family: Vazir
      fonts:
        - asset: lib/assets/fonts/Vazir.ttf
    - family: Samim
      fonts:
        - asset: lib/assets/fonts/Samim.ttf
    - family: Shabnam
      fonts:
        - asset: lib/assets/fonts/Shabnam.ttf
    - family: Sahel
      fonts:
        - asset: lib/assets/fonts/Sahel.ttf
    - family: Yekan
      fonts:
        - asset: lib/assets/fonts/Yekan.ttf
    - family: IranSansFaNum
      fonts:
        - asset: lib/assets/fonts/IranSansFaNum.ttf

flutter_intl:
  enabled: true

  plugin:
    platforms:
      android:
        package: com.sinamn75.u
        pluginClass: UPlugin
      ios:
        pluginClass: UPlugin
      linux:
        pluginClass: UPlugin
      macos:
        pluginClass: UPlugin
      windows:
        pluginClass: UPluginCApi
      web:
        pluginClass: UWeb
        fileName: u_web.dart

#  flutter pub global activate rename
#  flutter pub global run rename setBundleId --value ""
#  flutter pub global run rename setAppName --value ""
#  flutter pub run flutter_launcher_icons:main

